[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  # netlify-cli's auto-detection sees both a Svelte and a Vite dev command
  # (they're the same command, "vite") and prompts interactively without
  # this — pin it explicitly so `npm run dev:mp` boots non-interactively.
  command = "npm run dev"
  framework = "vite"
  targetPort = 5173

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
